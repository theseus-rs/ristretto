[package]
authors.workspace = true
categories.workspace = true
description = "JVM Garbage Collector"
edition.workspace = true
keywords = ["java", "jvm", "gc"]
license.workspace = true
name = "ristretto_gc"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
# Linux-only bounded publication-gate evidence; not complete pause qualification.
experimental-pause-recorder = []
# Alternative ordinary identity index; measured overhead currently rejects default use.
experimental-identity-index = []
# Compatibility alias: complete-graph projection coverage is always enabled.
experimental-trace-projections = []

[dependencies]
arc-swap = { workspace = true }
once_cell = { workspace = true }
portable-atomic = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
triomphe = { workspace = true, features = ["arc-swap"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
parking_lot = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
loom = { workspace = true }

[dev-dependencies]
test-log = { workspace = true, features = ["trace"] }

[[example]]
name = "wasm_smoke"
crate-type = ["cdylib"]

[[example]]
name = "gc_browser"
crate-type = ["cdylib"]
