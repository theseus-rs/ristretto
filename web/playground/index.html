<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Run Java, Kotlin, Groovy, Scala 2 and 3, and Clojure in your browser with the Ristretto playground. Your code stays on your device."
    />
    <meta name="theme-color" content="#f5f7f4" />
    <script>
      // Apply the local preference before the stylesheet paints the page.
      let preference;
      try {
        preference = localStorage.getItem('ristretto-playground-theme');
      } catch {}
      document.documentElement.dataset.theme =
        preference === 'light' || preference === 'dark'
          ? preference
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
    </script>
    <title>Playground · Ristretto</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/playground/main.ts"></script>
  </body>
</html>
