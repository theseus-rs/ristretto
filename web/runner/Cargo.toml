[package]
name = "ristretto_playground"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
name = "ristretto_playground_engine"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
ristretto_vm = { path = "../../ristretto_vm", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = { version = "0.57.1", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
ristretto_classloader = { path = "../../ristretto_classloader" }
tempfile = { workspace = true }
