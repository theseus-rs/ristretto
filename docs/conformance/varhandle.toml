# Each case expands to one row per JDK and combination of its axis values.
version = 1
suite = "method/varhandle"
inventory = true

[spec]
vh = "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/invoke/VarHandle.html"
lookup = "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/invoke/MethodHandles.Lookup.html"
mh = "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/invoke/MethodHandles.html"
desc = "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/invoke/VarHandle.VarHandleDesc.html"
bootstrap = "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/invoke/ConstantBootstraps.html"
segment = "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/foreign/MemorySegment.html"
layout = "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/foreign/MemoryLayout.html"
value = "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/foreign/ValueLayout.html"
mapping = "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/nio/channels/FileChannel.MapMode.html"
poly = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-2.html#jvms-2.9.3"
constraint = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-5.html#jvms-5.3.4"
field = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-5.html#jvms-5.4.3.2"
method = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-5.html#jvms-5.4.3.3"
mh_resolution = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-5.html#jvms-5.4.3.5"
dynamic = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-5.html#jvms-5.4.3.6"
access = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-5.html#jvms-5.4.4"
init = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-5.html#jvms-5.5"
ldc = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-6.html#jvms-6.5.ldc"
invokevirtual = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-6.html#jvms-6.5.invokevirtual"
jmm = "https://docs.oracle.com/javase/specs/jls/se25/html/jls-17.html#jls-17.4"

[sets]
lts = ["11", "17", "21", "25"]
exact = ["17", "21", "25"]
primitives = ["boolean", "byte", "short", "char", "int", "long", "float", "double"]
fields = ["$primitives", "String"]
views = ["short", "char", "int", "long", "float", "double"]
scalars = ["$primitives", "address"]
read = ["get", "getOpaque", "getAcquire", "getVolatile"]
write = ["set", "setOpaque", "setRelease", "setVolatile"]
cas = ["compareAndSet", "weakCompareAndSet", "weakCompareAndSetPlain", "weakCompareAndSetAcquire", "weakCompareAndSetRelease"]
exchange = ["compareAndExchange", "compareAndExchangeAcquire", "compareAndExchangeRelease"]
swap = ["getAndSet", "getAndSetAcquire", "getAndSetRelease"]
add = ["getAndAdd", "getAndAddAcquire", "getAndAddRelease"]
bit = ["getAndBitwiseOr", "getAndBitwiseOrAcquire", "getAndBitwiseOrRelease",
       "getAndBitwiseAnd", "getAndBitwiseAndAcquire", "getAndBitwiseAndRelease",
       "getAndBitwiseXor", "getAndBitwiseXorAcquire", "getAndBitwiseXorRelease"]
arithmetic_bit = ["$add", "$bit"]
updates = ["$cas", "$exchange", "$swap", "$arithmetic_bit"]
mutations = ["$write", "$updates"]
modes = ["$read", "$mutations"]
nonplain = ["getOpaque", "getAcquire", "getVolatile", "setOpaque", "setRelease", "setVolatile", "$updates"]

# Match all three signature-polymorphic switches used by the executable mode matrix.
[[enumeration]]
set = "modes"
source = "access_modes/ModeCalls.java"
pattern = '\bhandle\.(\w+)\('

# Successful access outcomes shared by the storage and invocation matrices.
[[rules.mode_outcomes]]
when = { mode = "$write" }
expect = "Store the operand and return void"
[[rules.mode_outcomes]]
when = { mode = "$cas" }
expect = "Mismatch returns false without mutation. A match installs the new value and returns true, allowing spurious failure for weak CAS"
[[rules.mode_outcomes]]
when = { mode = "$exchange" }
expect = "Return the old value on match and mismatch. Replace only on match"
[[rules.mode_outcomes]]
when = { mode = "$swap" }
expect = "Return the old value and store the operand"
[[rules.mode_outcomes]]
when = { mode = "$add" }
expect = "Return the old value and store the sum in the carrier type"
[[rules.mode_outcomes]]
when = { mode = "$bit" }
expect = "Return the old value and store the bitwise AND, OR or XOR selected by the mode"

[[case]]
id = "VH.FIELD_ARRAY.MODES"
spec = ["vh", "lookup", "mh"]
fixture = "access_modes"
evidence = ["Test.java#main", "Test.java#verify"]
java = "$lts"
axes = { storage = ["instance", "static", "array"], carrier = "$fields", mode = "$modes", route = ["direct", "toMethodHandle", "findVirtual", "varHandleInvoker", "varHandleExactInvoker"] }
rules = "mode_outcomes"
expect = "Return the stored value. Backing storage is unchanged"
[[case.override]]
when = { carrier = ["boolean", "String"], mode = "$add" }
expect = "UnsupportedOperationException. Original storage is preserved"
[[case.override]]
when = { carrier = ["String", "float", "double"], mode = "$bit" }
expect = "UnsupportedOperationException. Original storage is preserved"

[[case]]
id = "VH.FINAL.MODES"
spec = ["vh", "lookup"]
fixture = "access_modes"
evidence = ["Test.java#main", "Test.java#verify"]
java = "$lts"
axes = { storage = ["final-instance", "final-static"], carrier = "$fields", mode = "$modes", route = ["direct", "toMethodHandle", "findVirtual", "varHandleInvoker", "varHandleExactInvoker"] }
expect = "Return the stored value. Backing storage is unchanged"
[[case.override]]
when = { mode = "$mutations" }
expect = "UnsupportedOperationException. Original storage is preserved"

[[case]]
id = "VH.BYTE_VIEW.MODES"
spec = ["mh", "vh"]
fixture = "view_modes"
evidence = ["Test.java#exerciseViews", "Test.java#exercise"]
java = "$lts"
axes = { storage = ["byte-array", "heap-buffer", "direct-buffer"], carrier = "$views", mode = "$modes", order = ["LE", "BE"], offset = ["aligned", "misaligned"], route = ["direct", "toMethodHandle"] }
rules = "mode_outcomes"
expect = "Return the stored value. Backing storage is unchanged"
[[case.override]]
when = { java = "25", storage = "byte-array", mode = "$nonplain" }
expect = "UnsupportedOperationException. Original storage is preserved"
[[case.override]]
when = { carrier = ["short", "char"], mode = "$updates" }
expect = "UnsupportedOperationException. Original storage is preserved"
[[case.override]]
when = { carrier = ["float", "double"], mode = "$arithmetic_bit" }
expect = "UnsupportedOperationException. Original storage is preserved"
[[case.override]]
when = { java = "25", storage = "heap-buffer", mode = "$nonplain" }
expect = "IllegalStateException for the misaligned nonplain operation. Bytes are preserved"
[[case.override]]
when = { offset = "misaligned", mode = "$nonplain" }
expect = "IllegalStateException for the misaligned nonplain operation. Bytes are preserved"

[[case]]
id = "VH.SEGMENT.MODES"
spec = ["value", "layout", "segment"]
fixture = "segment_carriers"
evidence = ["Test.java#allModes", "Test.java#encode"]
java = ["25"]
axes = { storage = ["heap-segment", "native-segment"], carrier = "$scalars", mode = "$modes", order = ["LE", "BE"], alignment = "natural", route = "toMethodHandle" }
rules = "mode_outcomes"
expect = "Return the stored value. Backing storage is unchanged"
[[case.override]]
when = { carrier = ["boolean", "byte", "char", "short"], mode = "$updates" }
expect = "UnsupportedOperationException. Original storage is preserved"
[[case.override]]
when = { carrier = ["float", "double"], mode = "$arithmetic_bit" }
expect = "UnsupportedOperationException. Original storage is preserved"

[[case]]
id = "VH.SEGMENT.UNALIGNED"
spec = ["value", "layout"]
fixture = "segment_carriers"
evidence = ["Test.java#allModes", "Test.java#encode"]
java = ["25"]
axes = { storage = ["heap-segment", "native-segment"], carrier = ["short", "char", "int", "long", "float", "double", "address"], mode = "$modes", order = ["LE", "BE"], alignment = "one-byte" }
expect = "Return the stored value. Backing storage is unchanged"
[[case.override]]
when = { mode = "$nonplain" }
expect = "UnsupportedOperationException. Original storage is preserved"
[[case.override]]
when = { mode = "set" }
expect = "Store at the selected offset. Preserve adjacent bytes"

[[case]]
id = "VH.INVOKERS.MODES"
spec = ["mh", "poly", "method"]
fixture = "invocation"
evidence = ["Test.java#allInvokerModes", "Test.java#bind"]
java = "$lts"
axes = { storage = "instance", carrier = "int", mode = "$modes", route = ["toMethodHandle", "findVirtual", "varHandleInvoker", "varHandleExactInvoker"] }
rules = "mode_outcomes"
expect = "Return the stored value. Backing storage is unchanged"

[[case]]
id = "VH.INVOKERS.TYPES"
spec = ["mh", "mh_resolution"]
fixture = "invocation"
evidence = ["Test.java#allInvokerModes", "Test.java#bind", "Test.java#arrayInvokers"]
java = "$lts"
expect = "The revealed unbound type matches the descriptor. Adapting get widens int to long, exact invoker rejects it. Final SET throws. Array exchange returns the old long"

[[case]]
id = "VH.EXACT.PRIMITIVES"
spec = ["vh", "poly", "invokevirtual"]
fixture = "exact_primitives"
evidence = ["Test.java#main", "Test.java#checkBoolean", "Test.java#checkByte", "Test.java#checkShort", "Test.java#checkChar", "Test.java#checkInt", "Test.java#checkLong", "Test.java#checkFloat", "Test.java#checkDouble"]
java = "$exact"
axes = { storage = ["instance", "static", "array"], carrier = "$primitives", route = "direct-exact" }
expect = "Typed writes and reads agree with their Java backing storage. Changing exactly one descriptor component throws WrongMethodTypeException"

[[case]]
id = "VH.EXACT.BUFFER"
spec = ["vh", "mh"]
fixture = "exact_primitives"
evidence = ["Test.java#exactBuffer"]
java = "$exact"
expect = "Exact int read/write succeeds. A long offset in the descriptor throws WrongMethodTypeException"

[[case]]
id = "VH.EXACT.SEGMENT"
spec = ["vh", "layout"]
fixture = "segment_modes"
evidence = ["Test.java#exactSegment"]
java = ["25"]
expect = "Exact double read/write agrees with segment contents. A float operand throws WrongMethodTypeException"

[[case]]
id = "VH.EXACT.ADAPT"
spec = ["vh", "poly"]
fixture = "exact_invocation"
evidence = ["Test.java#main", "Test.java#sharedCallSites", "Test.java#adaptingInvoker", "Test.java#genericField"]
java = "$exact"
expect = "Reapplying the current behavior preserves identity. Exact mismatches reject boxing, widening and discarded results. Ordinary invocation adapts and shares storage"

[[case]]
id = "VH.BYTECODE.PRIMITIVES"
spec = ["poly", "invokevirtual", "vh"]
fixture = "primitive_call_sites"
evidence = ["Test.java#main"]
java = "$lts"
expect = "Primitive descriptors for all modes return the expected value and update the addressed slot. Long and floating conversions preserve Java rounding and signed zero"

[[case]]
id = "VH.SEGMENT.SCALARS"
spec = ["value", "segment"]
fixture = "segment_modes"
evidence = ["Test.java#wordModes", "Test.java#scalar", "Test.java#floatingComparisons", "Test.java#addresses", "Test.java#signedHeapByte"]
java = ["25"]
expect = "Check neighboring bytes, raw NaN witnesses, signed byte widening and address equality across segment aliases"

[[case]]
id = "VH.LAYOUT.PATHS"
spec = ["layout"]
fixture = "indirect"
evidence = ["Test.java#pathsAndBounds"]
java = ["25"]
expect = "Fixed and reverse sequence paths select the same element. Indexed union views alias. Pointer replacement retargets access. Dereference without target layout is rejected"

[[case]]
id = "VH.LAYOUT.BOUNDS"
spec = ["segment", "layout"]
fixture = "indirect"
evidence = ["Test.java#atomicRestrictions", "Test.java#nativeSegments"]
java = ["25"]
expect = "Read-only and confined atomic updates reject access. A zero-length slice rejects a word. Scaling Long.MAX_VALUE overflows. Closed access fails and rejected live writes preserve the value"

[[case]]
id = "VH.LAYOUT.SHARED"
spec = ["layout", "segment"]
fixture = "indirect"
evidence = ["Test.java#sharedLayout", "Test.java#closeDuringAccess", "Test.java#closedBufferView"]
java = ["25"]
expect = "Opposite-endian aliased updates sum correctly. Closing an arena invalidates its segment and byte-buffer view"

[[case]]
id = "VH.LAYOUT.STRIDE"
spec = ["layout", "value"]
fixture = "segment_modes"
evidence = ["Test.java#stridedPath", "Test.java#unaligned"]
java = ["25"]
expect = "Strided index selects the expected element and rejects the end index. One-byte alignment permits unaligned plain access"

[[case]]
id = "VH.MAPPED.MODES"
spec = ["mh", "mapping"]
