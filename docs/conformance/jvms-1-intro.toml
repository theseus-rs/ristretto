# Java SE 25 JVMS, chapter 1.
version = 1
suite = "."

[spec]
s1 = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-1.html"
s1_1 = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-1.html#jvms-1.1"
s1_2 = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-1.html#jvms-1.2"
s1_3 = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-1.html#jvms-1.3"
s1_4 = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-1.html#jvms-1.4"
s1_5 = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-1.html#jvms-1.5"
s1_5_1 = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-1.html#jvms-1.5.1"
s1_5_2 = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-1.html#jvms-1.5.2"
s1_6 = "https://docs.oracle.com/javase/specs/jvms/se25/html/jvms-1.html#jvms-1.6"

# Informative text and overviews. Related behavioral cases appear under their own sections.
[context]
s1 = "Introduction to the specification and its conventions."
s1_1 = "Historical background."
s1_2 = "Overview of the VM as a target for class files."
s1_3 = "Guide to the chapters."
s1_4 = "Typographic and cross-reference conventions."
s1_5 = "Preview feature terminology. Class-file acceptance is covered by 1.5.1."
s1_5_2 = """
This edition lists no preview VM features. Preview-dependent class files still use the version \
protocol."""
s1_6 = "Where readers can send feedback."

# Published source anchors beneath each section, in document order. Append a suffix to
# the section fragment (jvms-N for a chapter) to locate the original clause, rule or table.
[anchors]
s1_1 = ["-100", "-110", "-120", "-130", "-140"]
s1_2 = ["-100", "-110", "-120", "-130", "-140", "-150", "-160", "-200", "-210", "-220"]
s1_3 = ["-100", "-110", "-120", "-130", "-140", "-150", "-200", "-210"]
s1_4 = ["-100", "-110", "-120", "-130", "-200", "-200-A", "-200-B", "-300"]
s1_5 = ["-100", "-100-A", "-100-B", "-100-C", "-110", "-200", "-200-A", "-200-B", "-200-C"]
s1_5_1 = ["-100", "-200-A", "-200-B", "-210"]
s1_6 = ["-100", "-110"]

[[case]]
id = "JVMS.1.5.1.DISABLED"
spec = ["s1_5_1"]
java = "25"
status = "planned"
expect = "Loading a 69.65535 class with preview disabled throws UnsupportedClassVersionError."

[[case]]
id = "JVMS.1.5.1.ENABLED"
spec = ["s1_5_1"]
java = "25"
status = "planned"
expect = "With preview enabled, a structurally valid 69.65535 class can load on Java 25."

[[case]]
id = "JVMS.1.5.1.FOREIGN_RELEASE"
spec = ["s1_5_1"]
java = "25"
status = "planned"
expect = "Java 25 rejects a 68.65535 class even with preview enabled."

[[case]]
id = "JVMS.1.5.1.ORDINARY"
spec = ["s1_5_1"]
java = "25"
status = "planned"
expect = "A valid 69.0 class can load with preview disabled or enabled."
