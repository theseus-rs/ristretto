spec = ["s6_5_aastore_runtime_120"]
java = "25"
status = "planned"
expect = """
A valid index with a non-null reference incompatible with the run-time component type throws \
ArrayStoreException."""

[[case]]
id = "JVMS.6.5.AASTORE.NULL_ELEMENT"
spec = ["s6_5_aastore"]
java = "25"
status = "planned"
expect = """
A null reference can be stored in any non-null reference array at a valid index, regardless of \
its component class."""

