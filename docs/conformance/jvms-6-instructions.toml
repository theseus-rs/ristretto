[[case]]
id = "JVMS.6.2"
spec = ["s6_2"]
java = "25"
status = "planned"
expect = """
The reserved breakpoint, impdep1 and impdep2 bytes cannot appear as instructions in a valid \
class file."""

[[case]]
id = "JVMS.6.3"
spec = ["s6_3"]
java = "25"
status = "planned"
expect = """
A resource failure during execution may raise the applicable VirtualMachineError even at an \
instruction with no listed run-time exception."""

[[case]]
id = "JVMS.6.AALOAD"
spec = ["s6_5_aaload"]
java = "default"
fixture = "array/object"
evidence = ["Test.java#main"]
axes = { opcode = "aaload" }
expect = "Push the reference stored at the selected array index."

[[case]]
id = "JVMS.6.5.AALOAD.RUNTIME-100"
spec = ["s6_5_aaload_runtime_100"]
java = "25"
status = "planned"
expect = "A null array throws NullPointerException before any bounds check."

[[case]]
id = "JVMS.6.5.AALOAD.RUNTIME-110"
spec = ["s6_5_aaload_runtime_110"]
java = "default"
fixture = "array/object"
evidence = ["Test.java#main"]
expect = "A non-null array with an index outside [0, length) throws ArrayIndexOutOfBoundsException."

[[case]]
id = "JVMS.6.AASTORE"
spec = ["s6_5_aastore"]
java = "default"
fixture = "array/object"
evidence = ["Test.java#main"]
axes = { opcode = "aastore" }
expect = "Store null or a reference compatible with the run-time component type at the given index."

[[case]]
id = "JVMS.6.5.AASTORE.RUNTIME-100"
spec = ["s6_5_aastore_runtime_100"]
java = "25"
status = "planned"
