# Informative text and overviews. Related behavioral cases appear under their own sections.
[context]
s2 = "Abstract execution model."
s2_3 = "Overview of primitive values. The following sections define their domains."
s2_5 = "Inventory of per-thread and shared run-time areas."
s2_7 = "The VM may choose its own physical object layout."
s2_9 = "Introduction to methods treated specially by the VM."
s2_11 = "Overview of the instruction families specified in chapter 6."
s2_13 = "Implementations may choose their internal design while preserving observable behavior."

# Published source anchors beneath each section, in document order. Append a suffix to
# the section fragment (jvms-N for a chapter) to locate the original clause, rule or table.
