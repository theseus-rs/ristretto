[[case]]
id = "JVMS.2.1"
spec = ["s2_1"]
java = "25"
status = "planned"
expect = "Decode a multi-byte class-file quantity with its most significant byte first."

[[case]]
id = "JVMS.2.2"
spec = ["s2_2"]
java = "default"
fixture = "primitive/conversion"
evidence = ["Test.java#testIntToByte"]
expect = "Narrowing the same int to byte changes its value before it is passed back as an int."

[[case]]
id = "JVMS.2.3.1"
spec = ["s2_3_1"]
java = "default"
fixture = "math/integer"
evidence = ["Test.java#testIntAdd"]
expect = "Addition at the signed int boundary yields the low 32 bits of the mathematical sum."

[[case]]
id = "JVMS.2.3.1.DOMAINS"
spec = ["s2_3_1"]
java = "25"
status = "planned"
expect = """
Long values use signed 64-bit two's complement. Byte and short are signed while char represents \
an unsigned UTF-16 code unit."""

[[case]]
id = "JVMS.2.3.2"
spec = ["s2_3_2"]
java = "default"
fixture = "math/double"
evidence = ["Test.java#testDoubleSpecialValues"]
expect = "The double fixture distinguishes NaN and infinities from finite double values."

[[case]]
id = "JVMS.2.3.2.ZERO"
spec = ["s2_3_2"]
java = "25"
status = "planned"
expect = """
Positive and negative zero compare equal. Dividing a positive finite number by them produces \
infinities of opposite sign."""

[[case]]
id = "JVMS.2.3.3"
spec = ["s2_3_3"]
java = "25"
status = "planned"
expect = "In legacy subroutine bytecode, ret resumes at the instruction following the calling jsr."

[[case]]
id = "JVMS.2.3.4"
spec = ["s2_3_4"]
java = "default"
fixture = "array/boolean"
evidence = ["Test.java#main"]
expect = "A fresh boolean array reads false and a stored true reads back as true."

[[case]]
id = "JVMS.2.4"
spec = ["s2_4"]
java = "25"
fixture = "classloader/array_bootstrap_hierarchy"
evidence = ["Test.java#checkArray"]
expect = """
An array is an object whose class has the reference-type supertypes Object, Cloneable and \
Serializable."""

[[case]]
id = "JVMS.2.5.1"
spec = ["s2_5_1"]
java = "25"
status = "planned"
expect = """
A suspended thread resumes its own bytecode stream at the correct instruction after another \
thread runs."""

[[case]]
id = "JVMS.2.5.2"
spec = ["s2_5_2"]
java = "25"
fixture = "exceptions/stack_overflow_error"
evidence = ["Test.java#direct", "Test.java#main"]
expect = "Recursive calls that exhaust the Java stack raise StackOverflowError."

[[case]]
id = "JVMS.2.5.2.EXPANSION"
spec = ["s2_5_2"]
java = "25"
status = "planned"
expect = """
On a VM with dynamically expanding stacks, failure to obtain memory for stack expansion throws \
OutOfMemoryError."""

[[case]]
id = "JVMS.2.5.3"
spec = ["s2_5_3"]
java = "25"
status = "planned"
expect = """
If an object allocation requires more heap than the VM can provide after reclamation, it throws \
OutOfMemoryError."""

[[case]]
id = "JVMS.2.5.4"
spec = ["s2_5_4"]
java = "25"
status = "planned"
expect = """
If the method area cannot satisfy a class-data allocation, the VM throws OutOfMemoryError."""

[[case]]
id = "JVMS.2.5.5"
spec = ["s2_5_5"]
java = "25"
status = "planned"
expect = """
Two defining classes may use the same numerical pool index for different constants. Each \
resolves its own entry."""

[[case]]
id = "JVMS.2.5.5.ALLOCATION"
spec = ["s2_5_5"]
java = "25"
status = "planned"
expect = """
If a new run-time constant pool cannot be allocated in the method area, class creation throws \
OutOfMemoryError."""

[[case]]
id = "JVMS.2.5.6"
spec = ["s2_5_6"]
java = "25"
status = "planned"
expect = """
On a VM using native method stacks, exceeding the permitted native stack depth raises \
StackOverflowError."""

[[case]]
id = "JVMS.2.6"
spec = ["s2_6"]
java = "default"
fixture = "algorithm/merge_sort"
evidence = ["Test.java#mergeSort"]
expect = """
Each recursive invocation retains its own array bounds while the child invocations sort their \
subranges."""

[[case]]
id = "JVMS.2.6.1"
spec = ["s2_6_1"]
java = "default"
fixture = "method/parameters_returns"
evidence = ["Test.java#primitiveParameters"]
expect = "A method reads mixed-width parameters from their respective local slots."

[[case]]
id = "JVMS.2.6.1.OVERLAP"
spec = ["s2_6_1"]
java = "25"
status = "planned"
expect = """
Writing a local slot that holds the upper half of a two-slot value makes the original wide value \
unusable."""

[[case]]
id = "JVMS.2.6.1.ARGUMENT_ZERO"
spec = ["s2_6_1"]
java = "25"
status = "planned"
expect = """
On an instance call local zero receives the target. On a static call the first argument starts \
at zero."""

[[case]]
id = "JVMS.2.6.2"
spec = ["s2_6_2"]
java = "default"
fixture = "math/integer"
evidence = ["Test.java#testIntSub"]
expect = """
The top two operands of a subtraction are consumed in the order needed for left minus right."""

[[case]]
id = "JVMS.2.6.3"
spec = ["s2_6_3"]
java = "default"
fixture = "method/invocation_dispatch"
evidence = ["Test.java#testMethodDispatch"]
expect = "A symbolic virtual call uses the receiver class to select an overriding implementation."

[[case]]
id = "JVMS.2.6.4"
spec = ["s2_6_4"]
java = "default"
fixture = "method/parameters_returns"
evidence = ["Test.java#returnArray", "Test.java#main"]
expect = "The caller receives the array reference returned by the callee and can read its elements."

[[case]]
id = "JVMS.2.6.5"
spec = ["s2_6_5"]
java = "default"
fixture = "method/exceptions"
evidence = ["Test.java#handleExceptions"]
expect = "An exception propagates to the matching handler without delivering a normal return value."

[[case]]
id = "JVMS.2.8"
spec = ["s2_8"]
java = "25"
status = "planned"
expect = """
For float and double, compare raw results for signed zero, subnormal operands and halfway \
rounding under Java 25 strict arithmetic."""

[[case]]
id = "JVMS.2.8.GRADUAL_UNDERFLOW"
spec = ["s2_8"]
java = "25"
status = "planned"
expect = """
A floating-point operation whose exact magnitude falls below the normal range may produce a \
nonzero subnormal result."""

[[case]]
id = "JVMS.2.9.1"
spec = ["s2_9_1"]
java = "default"
fixture = "method/constructors"
evidence = ["Test.java#main"]
expect = """
Construction runs the superclass and subclass initialization code in the order observed by the \
fixture."""

[[case]]
id = "JVMS.2.9.2"
spec = ["s2_9_2"]
java = "default"
fixture = "field/static/initialization_order"
evidence = ["Test.java#main"]
expect = """
Active use runs the declaring class initializer and preserves the observable ordering of its \
static initializations."""

[[case]]
id = "JVMS.2.9.3"
spec = ["s2_9_3"]
java = "25"
fixture = "method/varhandle/exact_invocation"
evidence = ["Test.java#main"]
expect = """
A signature-polymorphic access uses the descriptor at its invocation site to decide whether an \
exact call succeeds."""

[[case]]
id = "JVMS.2.10"
spec = ["s2_10"]
java = "25"
fixture = "thread/uncaught_dispatch"
evidence = ["Test.java#main"]
expect = "An uncaught throwable reaches the terminating thread's uncaught-exception handler."

[[case]]
id = "JVMS.2.10.HANDLER_ORDER"
spec = ["s2_10"]
java = "25"
status = "planned"
expect = """
When two exception table entries cover an instruction and match the thrown type, the earlier \
entry handles it."""

[[case]]
id = "JVMS.2.10.ATHROW_PC"
spec = ["s2_10"]
java = "25"
status = "planned"
expect = "A protected range includes its start offset and excludes its end offset."

[[case]]
id = "JVMS.2.11.1"
spec = ["s2_11_1"]
java = "default"
fixture = "primitive/conversion"
evidence = ["Test.java#testIntToChar"]
expect = """
The char conversion produces an unsigned 16-bit value represented on the operand stack as an \
int."""

[[case]]
id = "JVMS.2.11.2"
spec = ["s2_11_2"]
java = "default"
fixture = "array/int"
evidence = ["Test.java#main"]
expect = "A write to one array index is visible on a subsequent load from that index."

[[case]]
id = "JVMS.2.11.3"
spec = ["s2_11_3"]
java = "default"
fixture = "math/integer"
evidence = ["Test.java#testIntDiv"]
expect = """
Signed integral division produces a quotient truncated toward zero for the exercised operands."""

[[case]]
id = "JVMS.2.11.4"
spec = ["s2_11_4"]
java = "default"
fixture = "primitive/conversion"
evidence = ["Test.java#testLongToInt"]
expect = "Converting a long to int retains the low 32 bits."

[[case]]
id = "JVMS.2.11.5"
spec = ["s2_11_5"]
java = "default"
fixture = "array/object"
evidence = ["Test.java#main"]
expect = "A newly allocated reference array contains null until elements are stored."

[[case]]
id = "JVMS.2.11.6"
spec = ["s2_11_6"]
java = "25"
status = "planned"
expect = """
Each legal dup form preserves the duplicated values and category widths in the specified stack \
order."""

[[case]]
id = "JVMS.2.11.7"
spec = ["s2_11_7"]
java = "default"
fixture = "branch/tableswitch"
evidence = ["Test.java#testSwitchValue"]
expect = "Each dense switch key reaches its case and an out-of-range key reaches the default."

[[case]]
id = "JVMS.2.11.8"
spec = ["s2_11_8"]
java = "default"
fixture = "method/invocation_dispatch"
evidence = ["Test.java#testInterfaceDispatch"]
expect = "An interface call dispatches to the selected implementation for the receiver."

[[case]]
id = "JVMS.2.11.9"
spec = ["s2_11_9"]
java = "default"
fixture = "method/exceptions"
evidence = ["Test.java#handleExceptions"]
expect = "A thrown object transfers control to the applicable handler."

[[case]]
id = "JVMS.2.11.10"
spec = ["s2_11_10"]
java = "default"
fixture = "thread/interrupt_complex"
evidence = ["Test.java#testInterruptDuringWait"]
expect = """
A waiting thread reacquires its monitor before handling the interrupt and leaving the \
synchronized block."""

[[case]]
id = "JVMS.2.11.10.REENTRANT"
spec = ["s2_11_10"]
java = "25"
status = "planned"
expect = """
A thread can reenter an owned monitor. Another thread cannot acquire it until the ownership \
count drops to zero."""

[[case]]
id = "JVMS.2.12"
spec = ["s2_12"]
java = "25"
status = "planned"
