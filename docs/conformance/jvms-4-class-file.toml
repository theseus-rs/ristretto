[[case]]
id = "JVMS.4.1"
spec = ["s4_1"]
java = "25"
status = "planned"
expect = """
An otherwise valid class with magic other than CAFEBABE is rejected with ClassFormatError."""

[[case]]
id = "JVMS.4.1.VERSION"
spec = ["s4_1"]
java = "25"
status = "planned"
expect = """
Java 25 rejects a class whose major version is greater than 69 with \
UnsupportedClassVersionError."""

[[case]]
id = "JVMS.4.1.SUPER"
spec = ["s4_1"]
java = "25"
status = "planned"
expect = """
For an ordinary class other than Object, super_class must identify a nonzero CONSTANT_Class \
entry."""

[[case]]
id = "JVMS.4.1.FLAGS"
spec = ["s4_1"]
java = "25"
status = "planned"
expect = "A class cannot be both final and abstract. Reject a class file that sets both flags."

[[case]]
id = "JVMS.4.1.MODULE_INFO"
spec = ["s4_1"]
java = "25"
status = "planned"
expect = """
ACC_MODULE denotes a module descriptor with the required name, zero superclass and no fields or \
methods."""

[[case]]
id = "JVMS.4.1.MINOR"
spec = ["s4_1"]
java = "25"
status = "planned"
expect = "For major versions 56 through 69, reject a minor version other than zero or 65535."

[[case]]
id = "JVMS.4.1.INTERFACE"
spec = ["s4_1"]
java = "25"
status = "planned"
expect = "An interface identifies Object as its superclass and carries the abstract flag."

[[case]]
id = "JVMS.4.1.ACCESS_FLAGS"
spec = ["s4_1"]
java = "25"
status = "planned"
expect = "A final class cannot declare a PermittedSubclasses attribute."

[[case]]
id = "JVMS.4.2.1"
spec = ["s4_2_1"]
java = "25"
status = "planned"
expect = """
A class constant for a non-array type uses slash-separated internal names. Reject a dotted \
binary name in its place."""

[[case]]
id = "JVMS.4.2.2"
spec = ["s4_2_2"]
java = "25"
status = "planned"
expect = """
Reject a field name containing a forbidden separator or an ordinary method name containing an \
angle bracket."""

[[case]]
id = "JVMS.4.2.3"
spec = ["s4_2_3"]
java = "25"
status = "planned"
expect = """
Read a package name in internal form and interpret the specified escaping in a module name."""

[[case]]
id = "JVMS.4.3.2"
spec = ["s4_3_2"]
java = "25"
status = "planned"
expect = "Parse the element type and rank of an array descriptor and reject an array of void."

[[case]]
id = "JVMS.4.3.3"
spec = ["s4_3_3"]
java = "25"
status = "planned"
expect = """
Reject a method descriptor containing void as a parameter or extra characters after its return \
descriptor."""

[[case]]
id = "JVMS.4.4"
spec = ["s4_4"]
java = "25"
status = "planned"
expect = """
Reject a reference to an unusable pool slot, an out-of-range index or an unrecognized constant \
tag."""

[[case]]
id = "JVMS.4.4.1"
spec = ["s4_4_1"]
java = "25"
status = "planned"
expect = """
The name index of a class constant must designate a UTF-8 entry naming a class, interface or \
array type."""

[[case]]
id = "JVMS.4.4.2"
spec = ["s4_4_2"]
java = "25"
status = "planned"
expect = """
A symbolic field or method reference must point to a class entry and a NameAndType entry of the \
appropriate descriptor kind."""

[[case]]
id = "JVMS.4.4.3"
spec = ["s4_4_3"]
java = "25"
