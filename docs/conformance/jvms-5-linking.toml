[[case]]
id = "JVMS.5.1"
spec = ["s5_1"]
java = "25"
fixture = "method/dynamic_bootstrap_arguments"
evidence = ["Test.java#main"]
expect = """
Uses of the same resolved method-handle constant in bootstrap arguments observe the same handle \
object."""

[[case]]
id = "JVMS.5.2"
spec = ["s5_2"]
java = "25"
status = "planned"
expect = "The initial class is linked and initialized before its selected main method starts."

[[case]]
id = "JVMS.5.3"
spec = ["s5_3"]
java = "25"
fixture = "classloader/loader_resolution"
evidence = ["Test.java#checkLoader"]
expect = "Resolved references use the defining loader of their classes."

[[case]]
id = "JVMS.5.3.1"
spec = ["s5_3_1"]
java = "default"
fixture = "class/define_class_identity"
evidence = ["Test.java#testClassLoaderIdentity"]
expect = "A bootstrap-defined class reports null as its Java class loader."

[[case]]
id = "JVMS.5.3.2"
spec = ["s5_3_2"]
java = "25"
fixture = "classloader/shadowed_parent"
evidence = ["Test.java#main"]
expect = """
A defined class reports its defining loader even when that loader shadows the ClassLoader parent \
field."""

[[case]]
id = "JVMS.5.3.3"
spec = ["s5_3_3"]
java = "25"
fixture = "classloader/sibling_array_delegation"
evidence = ["Test.java#main"]
expect = """
Reference array identity follows the component definition even when an initiating loader \
delegates."""

[[case]]
id = "JVMS.5.3.3.NO_COMPONENT_INIT"
spec = ["s5_3_3"]
java = "25"
fixture = "classloader/array_for_name_no_init"
evidence = ["Test.java#main"]
expect = "Loading an array class does not run its component class initializer."

[[case]]
id = "JVMS.5.3.3.PRIMITIVE"
spec = ["s5_3_3"]
java = "25"
status = "planned"
expect = "A primitive array class has the bootstrap defining loader and is public."

[[case]]
id = "JVMS.5.3.4"
spec = ["s5_3_4"]
java = "25"
fixture = "method/lookup_loader_constraints"
evidence = ["Test.java#main"]
expect = """
A conflicting descriptor type causes a LinkageError and the earlier compatible lookup remains \
usable."""

[[case]]
id = "JVMS.5.3.5"
spec = ["s5_3_5"]
java = "25"
status = "planned"
expect = """
A class definition whose internal name differs from the requested binary name fails with \
NoClassDefFoundError."""

[[case]]
id = "JVMS.5.3.5.FINAL_METHOD"
spec = ["s5_3_5"]
java = "25"
status = "planned"
expect = """
Derivation fails with IncompatibleClassChangeError if a declared instance method can override a \
final superclass method."""

[[case]]
id = "JVMS.5.3.5.DUPLICATE"
spec = ["s5_3_5"]
java = "25"
status = "planned"
expect = """
A loader cannot define the same binary name a second time. The attempt fails with LinkageError."""

[[case]]
id = "JVMS.5.3.5.CYCLE"
spec = ["s5_3_5"]
java = "25"
status = "planned"
expect = """
A circular superclass or superinterface dependency during derivation produces \
ClassCircularityError."""

[[case]]
id = "JVMS.5.3.5.FINAL"
spec = ["s5_3_5"]
java = "25"
status = "planned"
expect = """
Derivation fails with IncompatibleClassChangeError when the proposed direct superclass is final."""

[[case]]
id = "JVMS.5.3.5.INTERFACE_KIND"
spec = ["s5_3_5"]
java = "25"
status = "planned"
expect = """
A proposed direct superinterface that resolves to a class causes IncompatibleClassChangeError."""

[[case]]
id = "JVMS.5.3.6"
spec = ["s5_3_6"]
java = "25"
fixture = "method/varhandle/module_lookup"
evidence = ["Test.java#main"]
expect = "Classes in sibling module layers retain their own module and loader identities."

[[case]]
id = "JVMS.5.4"
spec = ["s5_4"]
java = "25"
status = "planned"
expect = """
A linkage error may be discovered eagerly but is reported only at a point where an action could \
require linkage."""

[[case]]
id = "JVMS.5.4.1"
spec = ["s5_4_1"]
java = "25"
status = "planned"
expect = "A class that fails bytecode verification raises VerifyError before its methods execute."

[[case]]
id = "JVMS.5.4.2"
spec = ["s5_4_2"]
java = "25"
fixture = "class/unsafe_array_loader"
evidence = ["Test.java#main"]
expect = "Prepared static storage contains its default value before class initialization."

[[case]]
id = "JVMS.5.4.2.DEFAULTS"
spec = ["s5_4_2"]
java = "25"
status = "planned"
expect = """
Preparation creates static fields with default values. ConstantValue assignments take place \
during initialization."""

[[case]]
id = "JVMS.5.4.3"
spec = ["s5_4_3"]
java = "25"
fixture = "method/bootstrap_linkage_errors"
evidence = ["Test.java#main"]
expect = """
Repeating a failed invokedynamic linkage at one instruction preserves its linkage failure."""

[[case]]
id = "JVMS.5.4.3.1"
spec = ["s5_4_3_1"]
java = "25"
status = "planned"
expect = """
Resolving an inaccessible symbolic class raises IllegalAccessError in the referring class."""

[[case]]
id = "JVMS.5.4.3.1.ARRAY"
spec = ["s5_4_3_1"]
java = "25"
status = "planned"
expect = """
Resolving a reference array type requires successful resolution of its reference element type."""

[[case]]
id = "JVMS.5.4.3.2"
spec = ["s5_4_3_2"]
java = "default"
fixture = "field/object/shadowing"
evidence = ["Test.java#main"]
expect = """
Field references with the same name resolve to different declarations according to the symbolic \
owner."""

[[case]]
id = "JVMS.5.4.3.2.ABSENT"
spec = ["s5_4_3_2"]
java = "25"
status = "planned"
expect = """
A missing field name and descriptor after the class, superinterface and superclass search causes \
NoSuchFieldError."""

[[case]]
id = "JVMS.5.4.3.3"
spec = ["s5_4_3_3"]
java = "25"
fixture = "method/handle_reference_linkage"
evidence = ["Test.java#main"]
expect = """
A class-method reference whose owner resolves to an interface fails with \
IncompatibleClassChangeError."""

[[case]]
id = "JVMS.5.4.3.3.ABSENT"
spec = ["s5_4_3_3"]
java = "25"
status = "planned"
expect = "A missing class method after the specified search causes NoSuchMethodError."

[[case]]
id = "JVMS.5.4.3.4"
spec = ["s5_4_3_4"]
java = "25"
fixture = "method/handle_reference_linkage"
evidence = ["Test.java#main"]
expect = """
An interface-method reference whose owner resolves to a class fails with \
IncompatibleClassChangeError."""

[[case]]
id = "JVMS.5.4.3.4.OBJECT"
spec = ["s5_4_3_4"]
java = "25"
status = "planned"
expect = "A matching public non-static Object method can resolve through an interface reference."

[[case]]
id = "JVMS.5.4.3.4.ABSENT"
spec = ["s5_4_3_4"]
java = "25"
status = "planned"
expect = "Interface method resolution with no suitable declaration produces NoSuchMethodError."

[[case]]
id = "JVMS.5.4.3.5"
spec = ["s5_4_3_5"]
java = "25"
fixture = "method/handle_reference_linkage"
evidence = ["Test.java#main"]
expect = """
Resolving a method handle checks symbolic member access before loading the handle's method type."""

[[case]]
id = "JVMS.5.4.3.5.TYPE"
spec = ["s5_4_3_5"]
java = "25"
status = "planned"
expect = """
Resolving a method type resolves its reference parameter and return types in the referring \
class's loading context."""

[[case]]
id = "JVMS.5.4.3.5.INITIALIZATION"
spec = ["s5_4_3_5"]
java = "25"
status = "planned"
expect = "Resolving a handle to a static member alone does not initialize the declaring class."

[[case]]
id = "JVMS.5.4.3.6"
spec = ["s5_4_3_6"]
java = "25"
fixture = "method/bootstrap_linkage_errors"
evidence = ["Test.java#main"]
expect = """
A bootstrap returning a CallSite with a target of the wrong type produces BootstrapMethodError."""

[[case]]
id = "JVMS.5.4.3.6.LOOKUP"
spec = ["s5_4_3_6"]
java = "25"
fixture = "method/bootstrap_linkage_errors"
evidence = ["Test.java#main"]
expect = "The bootstrap Lookup designates the class containing the dynamic call site."

[[case]]
id = "JVMS.5.4.3.6.THROWABLE"
spec = ["s5_4_3_6"]
java = "25"
fixture = "method/bootstrap_linkage_errors"
evidence = ["Test.java#main"]
expect = """
An ordinary exception thrown by the bootstrap is wrapped in BootstrapMethodError. An Error can \
propagate directly."""

[[case]]
id = "JVMS.5.4.3.6.ARGUMENTS"
spec = ["s5_4_3_6"]
java = "25"
fixture = "method/dynamic_bootstrap_arguments"
evidence = ["Test.java#main"]
expect = "Static bootstrap arguments are resolved and passed after the lookup, name and type."

[[case]]
id = "JVMS.5.4.3.6.NULL_SITE"
spec = ["s5_4_3_6"]
java = "25"
fixture = "method/bootstrap_linkage_errors"
evidence = ["Test.java#main"]
expect = "A bootstrap returning null instead of a CallSite causes BootstrapMethodError."

[[case]]
id = "JVMS.5.4.3.6.CONCURRENCY"
spec = ["s5_4_3_6"]
java = "25"
status = "planned"
expect = """
Concurrent bootstrap invocations at one site can race. Normal executions subsequently observe \
the one published call site."""

[[case]]
id = "JVMS.5.4.4"
spec = ["s5_4_4"]
java = "25"
fixture = "method/varhandle/module_lookup"
evidence = ["Test.java#main"]
expect = "Qualified access is evaluated in the lookup class's run-time module."

[[case]]
id = "JVMS.5.4.4.NEST"
spec = ["s5_4_4"]
java = "25"
status = "planned"
expect = """
Private member access between verified nestmates succeeds. A mere shared package does not grant \
private access."""

[[case]]
id = "JVMS.5.4.4.PACKAGE"
spec = ["s5_4_4"]
java = "25"
status = "planned"
expect = """
Classes with the same package spelling but different defining loaders are in different run-time \
packages."""

[[case]]
id = "JVMS.5.4.4.EXPORT"
spec = ["s5_4_4"]
java = "25"
status = "planned"
expect = """
Access from another named module requires readability and the applicable export of the declaring \
class's package."""

[[case]]
id = "JVMS.5.4.5"
spec = ["s5_4_5"]
java = "25"
fixture = "invoke/package_dispatch"
evidence = ["Test.java#main"]
expect = """
Package-private declarations in different run-time packages do not automatically override one \
another."""

[[case]]
id = "JVMS.5.4.5.PRIVATE"
spec = ["s5_4_5"]
java = "25"
status = "planned"
expect = """
A private instance method cannot be overridden by a declaration of the same signature in a \
subclass."""

[[case]]
id = "JVMS.5.4.6"
spec = ["s5_4_6"]
java = "default"
fixture = "method/interface/specific_defaults"
evidence = ["Test.java#main"]
expect = "Interface dispatch selects the maximally specific applicable default."

[[case]]
id = "JVMS.5.4.6.CONFLICT"
spec = ["s5_4_6"]
java = "25"
fixture = "method/interface/conflicting_defaults"
evidence = ["Test.java#main"]
expect = """
Competing concrete defaults without a selected implementation lead to \
IncompatibleClassChangeError at invocation."""

[[case]]
id = "JVMS.5.5"
spec = ["s5_5"]
java = "default"
fixture = "field/static/initialization_failure"
evidence = ["Test.java#main"]
expect = "After initialization fails, a later active use of that class throws NoClassDefFoundError."

[[case]]
id = "JVMS.5.5.DECLARING_CLASS"
spec = ["s5_5"]
java = "25"
fixture = "method/varhandle/static_initializer"
evidence = ["Test.java#inheritedStatics"]
expect = "An inherited static field access initializes the type that actually declares the field."

[[case]]
id = "JVMS.5.5.DEFAULT_INTERFACES"
spec = ["s5_5"]
java = "25"
status = "planned"
expect = """
Class initialization visits the relevant superinterfaces declaring default methods in the \
specified order."""

[[case]]
id = "JVMS.5.5.REENTRANT"
spec = ["s5_5"]
java = "25"
status = "planned"
expect = """
A recursive request from the initializing thread proceeds without rerunning its class \
initializer."""

[[case]]
id = "JVMS.5.5.CONTENDED"
spec = ["s5_5"]
java = "25"
status = "planned"
expect = """
