[workspace]
exclude = [
    "ristretto_gc/validation/catalog/catalog-tagged-prototype",
    "ristretto_gc/validation/catalog/catalog-tagged-pool-prototype",
]
default-members = [
    "ristretto_classfile",
    "ristretto_classloader",
    "ristretto_gc",
    "ristretto_intrinsics",
    "ristretto_java",
    "ristretto_javac",
    "ristretto_jit",
    "ristretto_jimage",
    "ristretto_macros",
    "ristretto_pom",
    "ristretto_resolver",
    "ristretto_types",
    "ristretto_vm",
]
members = [
    "benchmarks/interpreter",
    "examples/*",
    "ristretto_classfile",
    "ristretto_classloader",
    "ristretto_gc",
    "ristretto_intrinsics",
    "ristretto_jimage",
    "ristretto_java",
    "ristretto_javac",
    "ristretto_jit",
    "ristretto_macros",
    "ristretto_pom",
    "ristretto_resolver",
    "ristretto_test_util",
    "ristretto_types",
    "ristretto_vm",
    "web/runner",
]
resolver = "3"

[workspace.package]
authors = ["Brian Heineman <brian.heineman@gmail.com>"]
categories = ["development-tools"]
edition = "2024"
keywords = ["java", "jvm"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/theseus-rs/ristretto"
rust-version = "1.100.0"
version = "0.35.0"

[workspace.dependencies]
ahash = "0.8.12"
anstyle = "1.0.14"
anyhow = "1.0.104"
arc-swap = "1.9.4"
async-recursion = "1.2.0"
bitflags = "2.13.2"
bytes = "1.12.2"
bytemuck = "1.25.2"
byteorder = "1.5.0"
clap = "4.6.9"
console = "0.16.6"
core-foundation-sys = "0.8.7"
coreaudio-sys = { version = "0.2.18", features = ["audio_unit"] }
cpal = "0.18.2"
cranelift = "0.138.0"
criterion = { version = "0.8.2", default-features = false }
dashmap = "6.2.1"
dirs = "7.0.0"
filetime = "0.2.30"
flate2 = "1.1.11"
fancy-regex = "0.20.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
glob = "0.3.4"
hashbrown = { version = "0.17.1", features = ["equivalent"] }
indoc = "2.0.8"
indexmap = "2.14.2"
jiff = "1.0.2"
libc = "0.2.191"
libjpeg-turbo-rs = "0.9.0"
libloading = "0.9.1"
loom = "0.7.2"
memchr = "2.8.3"
memmap2 = "0.9.12"
md-5 = "0.11.0"
midir = "0.11.1"
nix = "0.32.0"
once_cell = "1.21.4"
os_info = "3.15.0"
os_pipe = "1.2.3"
parking_lot = "0.13.0"
plotters = { version = "0.3.7", default-features = false }
portable-atomic = "1.15.0"
proc-macro2 = "1.0.107"
quick-xml = "0.42.0"
quote = "1.0.47"
rayon = "1.12.0"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.46", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
smallvec = "1.16.6"
socket2 = "0.6.5"
stacker = "0.1.25"
syn = "3.0.10"
# GPU monitoring requires statx, which older release target sysroots do not provide.
sysinfo = { version = "0.40.4", default-features = false, features = ["disk", "network", "system"] }
sys-locale = "0.3.2"
tar = "0.4.46"
tempfile = "3.27.0"
test-log = "0.2.21"
thiserror = "2.0.21"
thread-priority = "3.1.1"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
triomphe = { version = "0.1.17", default-features = false, features = ["std"] }
url = "2.5.9"
walkdir = "2.5.1"
wasm-bindgen-futures = "0.4.80"
whoami = "2.1.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Registry", "Win32_Security"] }
wstd = "0.6.8"
zerocopy = "0.8.64"
zip = { version = "9.8.1", default-features = false }

[workspace.lints.rust]
dead_code = "allow"
missing_debug_implementations = "deny"
unsafe_code = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(coverage)"] }
unused_qualifications = "deny"
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
excessive_nesting = "deny"
expect_used = "deny"
fallible_impl_from = "deny"
indexing_slicing = "deny"
large_stack_arrays = "allow"
mod_module_files = "deny"
panic = "deny"
panic_in_result_fn = "deny"
result_large_err = "allow"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

[workspace.metadata.release]
shared-version = true
dependent-version = "upgrade"
tag-name = "v{{version}}"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"

[profile.release-tests]
inherits = "release"
debug-assertions = true
panic = "unwind"

[profile.dist]
inherits = "release"
