[package]
authors.workspace = true
categories.workspace = true
description = "JVM JIT Compiler"
edition.workspace = true
keywords = ["java", "jvm", "jit"]
license.workspace = true
name = "ristretto_jit"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
ahash = { workspace = true }
portable-atomic = { workspace = true, optional = true }
ristretto_classfile = { path = "../ristretto_classfile", version = "0.35.0" }
thiserror = { workspace = true }
zerocopy = { workspace = true, features = ["derive"] }

[target.'cfg(all(not(target_family = "wasm"), target_endian = "little", not(any(target_arch = "mips", target_arch = "mips64", target_os = "dragonfly", target_os = "solaris"))))'.dependencies]
cranelift = { workspace = true, features = ["jit", "module", "native"] }
stacker = { workspace = true }

[dev-dependencies]
indexmap = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ristretto_test_util = { path = "../ristretto_test_util", version = "0.35.0" }

[features]
execution-profile = ["dep:portable-atomic"]
experimental-reference-dispatch = []
