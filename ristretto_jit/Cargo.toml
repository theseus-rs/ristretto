[package]
authors.workspace = true
categories.workspace = true
description = "JVM JIT Compiler"
edition.workspace = true
keywords = ["java", "jvm", "jit"]
license.workspace = true
name = "ristretto_jit"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
ahash = { workspace = true }
ristretto_classfile = { path = "../ristretto_classfile", version = "0.33.1" }
thiserror = { workspace = true }
zerocopy = { workspace = true }

[target.'cfg(all(not(target_family = "wasm"), target_endian = "little", not(any(target_arch = "mips", target_arch = "mips64", target_os = "dragonfly", target_os = "solaris"))))'.dependencies]
cranelift = { workspace = true, features = ["jit", "module", "native"] }

[dev-dependencies]
indexmap = { workspace = true }
