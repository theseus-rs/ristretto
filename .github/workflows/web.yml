name: Web

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build site and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust and WASI target
        run: |
          rustup toolchain install --no-self-update
          rustup target add wasm32-wasip2
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.ristretto/linux-x64
          key: playground-corretto-${{ hashFiles('playground/jdks.json') }}
      - name: Install pinned Java runtimes
        working-directory: playground
        run: npm run install:jdks
      - name: Build playground
        working-directory: playground
        run: |
          npm ci
          npm run format:check
          npm run test:unit
          npm run build:runtime
          npm run build
      - name: Build documentation
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/oranda/releases/download/v0.6.1/oranda-installer.sh | sh
          oranda build
          cp -R playground/dist public/playground
          touch public/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: playground-site
          path: public
          include-hidden-files: true
          retention-days: 7

  browsers:
    name: Browser (${{ matrix.browser }})
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: playground-site
          path: public
      - name: Test Java in browser
        working-directory: playground
        run: |
          npm ci
          cp -R ../public/playground dist
          npx playwright install --with-deps ${{ matrix.browser }}
          npm test -- --project=${{ matrix.browser }}
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playground-browser-${{ matrix.browser }}
          path: playground/test-results
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    needs: [web, browsers]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: playground-site
          path: public
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          branch: playground-pages
          folder: public
          token: ${{ secrets.GITHUB_TOKEN }}
          single-commit: true
