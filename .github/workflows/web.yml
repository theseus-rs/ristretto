name: Web

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Published stable release to archive and deploy
        required: true
        type: string
      release_sha:
        description: Exact source commit used by the release
        required: true
        type: string

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ inputs.release_tag == '' }}

jobs:
  web:
    name: Build site and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          git check-ref-format "refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          gh release view --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease -- "$RELEASE_TAG" \
            | jq -e '.isDraft == false and .isPrerelease == false'
      - name: Install Rust and WASI target
        run: |
          rustup toolchain install --no-self-update
          rustup target add wasm32-wasip2
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.ristretto/linux-x64
          key: playground-corretto-${{ hashFiles('web/jdks.json') }}
      - name: Install pinned Java runtimes
        working-directory: web
        run: npm run install:jdks
      - uses: actions/cache@v4
        with:
          path: ~/.ristretto/languages
          key: playground-languages-${{ hashFiles('web/languages.json') }}
      - name: Build web applications
        working-directory: web
        run: |
          npm ci
          npm run format:check
          npm run test:unit
          npm run build:runtime
          npm run build
      - name: Check JShell runtimes
        working-directory: web
        timeout-minutes: 30
        run: npm run test:shell
      - name: Check script runtimes
        working-directory: web
        timeout-minutes: 65
        run: npm run test:languages
      - name: Build documentation
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/oranda/releases/download/v0.6.1/oranda-installer.sh | sh
          oranda build
          cp -R web/dist/. public/
          touch public/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: playground-site
          path: public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  browsers:
    name: Browser (${{ matrix.browser }})
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: playground-site
          path: public
      - name: Test playgrounds in browser
        working-directory: web
        run: |
          npm ci
          cp -R ../public dist
          npx playwright install --with-deps ${{ matrix.browser }}
          npm test -- --project=${{ matrix.browser }}
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playground-browser-${{ matrix.browser }}
          path: web/test-results
          retention-days: 7

  archive:
    name: Archive tested playground on the release
    needs: [web, browsers]
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playground-site
          path: public
      - name: Upload site archive and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          archive="playground-site-${RELEASE_TAG//\//-}.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --dereference --hard-dereference -C public -cf - . | gzip -n > "$archive"
          sha256sum "$archive" > "$archive.sha256"
          # Preserve the tested release build. Retry deployments with Deploy playground.
          gh release upload --repo "$GITHUB_REPOSITORY" -- \
            "$RELEASE_TAG" "$archive" "$archive.sha256"

  deploy:
    name: Deploy released playground
    needs: archive
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/web-deploy.yml
    with:
      release_tag: ${{ inputs.release_tag }}
