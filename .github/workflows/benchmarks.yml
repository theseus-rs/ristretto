name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install --component llvm-tools-preview --no-self-update

      - name: Install Linux dependencies
        run: .github/scripts/setup-linux.sh

      # Contributor code runs without secrets or write permissions. Publishing
      # happens on a fresh runner in benchmarks-report.yml.
      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          cargo bench 2>&1 | tee "$RUNNER_TEMP/benchmark-results.txt"

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-results.txt
          if-no-files-found: error
          retention-days: 7
