name: Fast checks

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - name: Install cargo audit
        run: cargo install cargo-audit
      - name: Audit dependencies
        run: |
          cargo audit \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0235

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - name: Install Linux dependencies
        run: .github/scripts/setup-linux.sh
      - name: Verify the alpha JVM's collector dependencies
        run: python3 benchmarks/gc/release/verify_alpha_heap.py
      - name: Check the project
        run: |
          cargo check --workspace --all-targets --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - name: Install cargo deny
        run: cargo install cargo-deny
      - name: Check licenses
        run: cargo deny check --allow duplicate

  doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - name: Install Linux dependencies
        run: .github/scripts/setup-linux.sh
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --all-features

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install --component rustfmt --no-self-update
      - name: Check formatting
        run: cargo fmt --all --check

  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      # Check packaging and publish order; compilation is covered by the check job.
      - name: Check crate publishing
        run: cargo publish --workspace --dry-run --no-verify --locked
      - name: Build the packaged native preview features
        run: |
          python3 .github/scripts/check-packaged-features.py \
            ristretto_gc/experimental-canonical-runtime \
            ristretto_vm/experimental-reference-dispatch \
            ristretto_jit/experimental-reference-dispatch
      - name: Install WASI target
        run: rustup target add wasm32-wasip2
      - name: Build the packaged WASI interpreter and GC adapter
        run: |
          python3 .github/scripts/check-packaged-features.py --target wasm32-wasip2 \
            ristretto_gc/experimental-canonical-runtime \
            ristretto_vm
